<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Regia Asta — Fantacalcio 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1410;
    --surface:#101E17;
    --surface2:#152820;
    --line:#20362B;
    --text:#EDEDE3;
    --text-dim:#8CA396;
    --gold:#D9A62E;
    --semitop:#4F9C82;
    --lowcost:#3B6B58;
    --sorprese:#5B6D64;
    --amber:#F2B705;
    --red:#C0483A;
    --green:#3F8F5F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{padding-bottom:20px;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#0A1410 85%,rgba(10,20,16,0));
    padding:14px 14px 6px; border-bottom:1px solid var(--line);}
  .title-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .title-row h1{font-size:20px; margin:0; color:var(--text); font-weight:700;}
  .title-row .tag{font-size:10px; color:var(--amber); font-weight:600; letter-spacing:0.12em;}

  .scoreboard{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:10px;}
  .sb-cell{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:8px 6px; text-align:center;}
  .sb-cell .lbl{font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:3px;}
  .sb-cell .val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:var(--amber);}
  .sb-cell.warn .val{color:var(--red);}
  .sb-cell input{width:100%; background:transparent; border:none; color:var(--amber); font-family:'JetBrains Mono',monospace;
    font-weight:700; font-size:18px; text-align:center; outline:none;}

  .roles-strip{display:flex; gap:6px; margin-top:8px;}
  .role-chip{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:6px 4px; text-align:center; cursor:pointer;}
  .role-chip.active{background:var(--surface2); border-color:var(--amber);}
  .role-chip .rn{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;}
  .role-chip .rc{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-dim);}
  .role-chip.active .rc{color:var(--amber);}

  .strategy{margin:10px 14px 0; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px;}
  .strategy summary{cursor:pointer; font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; list-style:none; display:flex; justify-content:space-between; align-items:center;}
  .strategy summary::-webkit-details-marker{display:none;}
  .strategy summary .arrow{transition:transform .15s;}
  .strategy[open] summary .arrow{transform:rotate(90deg);}
  .strat-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:13px;}
  .strat-row:first-of-type{border-top:none;}
  .strat-label{min-width:92px; font-weight:600; font-size:11.5px; letter-spacing:0.03em;}
  .strat-bar{flex:1; height:6px; background:var(--line); border-radius:3px; margin:0 10px; overflow:hidden;}
  .strat-bar-fill{height:100%; background:var(--green);}
  .strat-target{width:40px; background:var(--surface2); border:1px solid var(--line); color:var(--text); text-align:center;
    border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:13px; padding:3px 0;}
  .strat-subhead{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em;
    margin-top:12px; padding-top:10px; border-top:1px solid var(--line);}

  .search-wrap{margin:10px 14px 0;}
  .search-wrap input{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px; color:var(--text); font-size:14px; outline:none;}
  .search-wrap input:focus{border-color:var(--amber);}

  main{padding:10px 14px 20px;}

  .tier-header{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; padding:16px 2px 6px; color:var(--text-dim);}
  .tier-header:first-child{padding-top:2px;}
  .tier-header.tier-PREFERITI{color:#f6c453;}
  .tier-header.tier-TOP{color:var(--gold);}
  .tier-header.tier-SEMITOP{color:var(--semitop);}
  .tier-header.tier-LOWCOST_TITOLARI{color:var(--lowcost);}
  .tier-header.tier-LOWCOST_SORPRESE{color:var(--sorprese);}

  .player{background:var(--surface); border:1px solid var(--line); border-radius:8px; margin-bottom:6px; overflow:hidden;}
  .player.status-mine{border-color:var(--green); background:linear-gradient(90deg, rgba(63,143,95,0.14), var(--surface) 40%);}
  .player.status-other{opacity:0.42;}
  .p-row{display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer;}
  .p-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .tier-TOP-dot{background:var(--gold);}
  .tier-SEMITOP-dot{background:var(--semitop);}
  .tier-LOWCOST_TITOLARI-dot{background:var(--lowcost);}
  .tier-LOWCOST_SORPRESE-dot{background:var(--sorprese);}
  .p-namewrap{flex:1; min-width:0;}
  .p-name{font-size:14.5px; font-weight:600; line-height:1.25; margin-bottom:3px;}

  .current-injury{
    display:inline-block;
    margin-left:5px;
    color:#E05A4F;
    font-size:0.9em;
    line-height:1;
    vertical-align:1px;
    text-shadow:0 0 7px rgba(224,90,79,.22);
  }
  .injury-detail{
    border-color:rgba(224,90,79,.45);
    background:rgba(192,72,58,.08);
  }
  .injury-detail .decision-lbl{color:#E05A4F;}
  .injury-detail .decision-val{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;max-width:100%;}
  .injury-detail-val{
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    line-height:1.4;
    overflow-wrap:anywhere;
    word-break:normal;
    max-width:100%;
  }
  .injury-detail-val b{
    color:var(--text);
    font-weight:600;
  }
  .injury-detail-val span{
    color:var(--text-dim);
  }

.fav-star{color:#f6c453; font-size:0.95em; margin-left:4px; vertical-align:1px; text-shadow:0 0 8px rgba(246,196,83,.22);}
  .p-name .strike{text-decoration:line-through;}
  .p-team{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em;}
  .p-badge{font-size:9px; padding:2px 6px; border-radius:4px; font-weight:700; letter-spacing:0.05em; flex-shrink:0;}
  .p-badge.mine{background:var(--green); color:#0A1410;}
  .p-badge.other{background:var(--red); color:#0A1410;}
  .p-price-block{text-align:right; flex-shrink:0;}
  .p-price-main{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:var(--amber); margin-bottom:3px;}
  .p-price-main.paid{color:var(--green);}
  .p-price-main.other{color:var(--red);}
  .p-price-sub{font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em;}
  .p-score{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; color:var(--text-dim);}
  .p-metrics{display:flex; align-items:flex-start; gap:4px; text-align:right;}
  .p-metric{min-width:40px; display:flex; flex-direction:column; align-items:flex-end;}
  .p-metric-starter,.p-metric-injury,.p-metric-score{min-width:31px;}
  .p-metric-label{font-size:7px; line-height:1; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; margin-bottom:3px; height:7px;}
  .p-metric-value{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; line-height:1.05;}
  .p-metric-score .p-metric-value{color:var(--text-dim); font-size:13px; font-weight:500;}
  .p-metric-starter .p-metric-value{color:var(--text-dim); font-size:13px; font-weight:700;}
  .p-health-inline .tit-inline{color:var(--text-dim);}
  .p-metric-injury .p-metric-value{font-size:13px; font-weight:700;}
  .p-metric-ideal,.p-metric-max{min-width:50px;}
  .p-metric-max{margin-left:-2px;}
  .p-metric-ideal .p-metric-value,.p-metric-max .p-metric-value{font-size:17px;}
  .p-metric-injury.inj-low .p-metric-value{color:var(--green);}
  .p-metric-injury.inj-mid .p-metric-value{color:var(--amber);}
  .p-metric-injury.inj-high .p-metric-value{color:var(--red);}
  .p-metric-injury.inj-na .p-metric-value{color:var(--text-dim);}
  .p-health-inline{display:flex; justify-content:flex-end; gap:4px; align-items:center; font-family:'JetBrains Mono',monospace; font-size:9px; margin-bottom:2px;}
  .p-health-inline .inj-low{color:var(--green);}
  .p-health-inline .inj-mid{color:var(--amber);}
  .p-health-inline .inj-high{color:var(--red);}
  .p-health-inline .inj-na{color:var(--text-dim);}
  .p-metric-ideal .p-metric-value{color:var(--amber);}
  .p-metric-max .p-metric-value{color:#C76A24;}

  .p-panel{display:none; padding:0 12px 12px; gap:8px; flex-wrap:wrap;}
  .p-panel.open{display:flex;}
  .p-panel input[type=number]{width:70px; background:var(--surface2); border:1px solid var(--line); border-radius:6px;
    padding:7px 8px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:14px; outline:none;}
  .p-panel input[type=number]:focus{border-color:var(--amber);}
  .p-panel label{font-size:10px; color:var(--text-dim); display:block; margin-bottom:3px; text-transform:uppercase;}
  .p-panel .fld{display:flex; flex-direction:column;}
  .btn{border:none; border-radius:6px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:0.03em;}
  .btn-mine{background:var(--green); color:#0A1410;}
  .btn-other{background:var(--red); color:#0A1410;}
  .btn-free{background:var(--line); color:var(--text-dim);}
  .btn-row{display:flex; gap:6px; align-items:flex-end; margin-left:auto;}

  .empty{text-align:center; color:var(--text-dim); font-size:13px; padding:30px 0;}

  footer{margin-top:10px; padding:10px 14px 4px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-dim);}
  footer button{background:none; border:1px solid var(--line); color:var(--text-dim); font-size:11px; padding:5px 10px; border-radius:6px; cursor:pointer;}
  footer .status{font-family:'JetBrains Mono',monospace;}

  /* PHASE BANNER */
  .phase-banner{margin:8px 14px 0; background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:6px 10px; font-size:11px; color:var(--text-dim); display:flex; justify-content:space-between; align-items:center;}
  .phase-banner .n{font-family:'JetBrains Mono',monospace; color:var(--amber); font-weight:700;}

  /* PRICE TREND */
  .p-trend{font-size:11px; margin-left:2px;}
  .p-trend.up{color:var(--red);}
  .p-trend.down{color:var(--green);}

  /* OWNER CHIPS in panel */
  .owner-chips{display:flex; flex-wrap:wrap; gap:5px; width:100%;}
  .owner-chip{background:var(--surface2); border:1px solid var(--line); color:var(--text-dim); font-size:10.5px;
    font-weight:700; padding:5px 8px; border-radius:5px; cursor:pointer; letter-spacing:0.02em;}
  .owner-chip.active{background:var(--red); color:#0A1410; border-color:var(--red);}
  .panel-section-lbl{font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; width:100%; margin-bottom:2px;}

  /* ROSE PANEL */
  .rose-card{background:var(--surface2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px;}
  .rose-head{display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer;}
  .rose-name{font-size:13px; font-weight:700;}
  .rose-name.me{color:var(--amber);}
  .rose-name-input{background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--text);
    font-size:13px; font-weight:700; width:100px; outline:none;}
  .rose-stats{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--amber); display:flex; gap:8px;}
  .rose-stats b{color:var(--text);}
  .rose-slots{display:flex; gap:6px; margin-top:6px;}
  .rose-slot{flex:1; text-align:center; background:var(--surface); border-radius:4px; padding:3px 0; font-size:10px; font-family:'JetBrains Mono',monospace; color:var(--text-dim);}
  .rose-slot.full{color:var(--green); font-weight:700;}
  .rose-players{display:none; margin-top:8px; border-top:1px solid var(--line); padding-top:8px;}
  .rose-players.open{display:block;}
  .rose-player-row{display:flex; justify-content:space-between; font-size:11.5px; padding:3px 0; color:var(--text-dim);}
  .rose-player-row b{color:var(--text); font-weight:500;}
  .rose-player-row .mono{color:var(--amber);}

  /* HIDE-TAKEN TOGGLE + SHOW-TAKEN LINK */
  .list-controls{display:flex; align-items:center; justify-content:space-between; margin:10px 14px 0; gap:8px;}
  .toggle-wrap{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); cursor:pointer; user-select:none;}
  .toggle-switch{width:30px; height:17px; border-radius:9px; background:var(--line); position:relative; flex-shrink:0; transition:background .15s;}
  .toggle-switch::after{content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:var(--text-dim); transition:transform .15s, background .15s;}
  .toggle-switch.on{background:var(--green);}
  .toggle-switch.on::after{transform:translateX(13px); background:#0A1410;}
  .show-taken-link{font-size:11px; color:var(--text-dim); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0;}

  /* TIER HEADER SCARCITY */
  .tier-header{display:flex; align-items:baseline; justify-content:space-between;}
  .tier-scarcity{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim);}
  .tier-scarcity.low{color:var(--red); font-weight:700;}

  /* AFFARE BADGE */
  .p-affare{display:inline-flex; align-items:center; gap:2px; font-size:9px; font-weight:700; color:var(--amber);
    background:rgba(242,183,5,0.14); border:1px solid rgba(242,183,5,0.4); padding:1px 5px; border-radius:4px; margin-top:2px;}
  .p-intel{display:flex; gap:4px; flex-wrap:wrap; margin-top:4px;}
  .intel-tag{font-size:8px; line-height:1; font-weight:700; padding:2px 5px; border-radius:4px; border:1px solid var(--line);
    color:var(--text-dim); background:var(--surface2); text-transform:uppercase; letter-spacing:.035em;}
  .intel-tag.affare{color:var(--amber); border-color:rgba(242,183,5,.45);}
  .intel-tag.cliff{color:#E5A35B; border-color:rgba(229,163,91,.45);}
  .intel-tag.press{color:#D98479; border-color:rgba(192,72,58,.45);}
  .intel-tag.rig{color:var(--gold);border-color:rgba(217,166,46,.55);background:rgba(217,166,46,.08);}
  .decision-box{width:100%; display:grid; grid-template-columns:1fr; gap:5px; margin-bottom:2px;}
  .decision-cell{background:var(--surface2); border:1px solid var(--line); border-radius:5px; padding:6px 7px; min-width:0;}
  .decision-lbl{font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
  .decision-val{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* BUDGET DINAMICO PANEL */
  .budget-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:12.5px;}
  .budget-row:first-of-type{border-top:none;}
  .budget-role{min-width:38px; font-weight:700; font-size:11px;}
  .budget-mid{flex:1; text-align:center; color:var(--text-dim); font-size:10.5px;}
  .budget-slot{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--amber); font-size:14px; min-width:56px; text-align:right;}

  /* SUGGERIMENTI CHIAMATA */
  .suggest-panel{margin:10px 14px 0; background:var(--surface); border:1px solid var(--amber); border-radius:8px; padding:10px 12px;}
  .suggest-header{font-size:12px; font-weight:700; color:var(--amber); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;}
  .suggest-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line);}
  .suggest-row:first-of-type{border-top:none;}
  .suggest-namewrap{flex:1; min-width:0;}
  .suggest-name{font-size:13.5px; font-weight:600;}
  .suggest-team{font-size:10px; color:var(--text-dim); font-weight:400; text-transform:uppercase;}
  .suggest-tags{display:flex; gap:4px; margin-top:6px; flex-wrap:wrap;}
  .suggest-tag{font-size:8.5px; font-weight:700; color:var(--text-dim); background:var(--surface2); border:1px solid var(--line);
    padding:1px 5px; border-radius:4px; text-transform:uppercase; letter-spacing:0.03em;}
  .suggest-price{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; color:var(--amber); flex-shrink:0;}
  .gk-suggest-card{padding:9px 0 10px; border-top:1px solid var(--line);}
  .gk-suggest-card:first-of-type{border-top:none;}
  .gk-suggest-head{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .gk-suggest-head .suggest-namewrap{flex:1;}
  .gk-pairs{display:grid; gap:5px; margin-left:16px;}
  .gk-pair{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface2); border:1px solid var(--line); border-radius:5px; padding:6px 8px;}
  .gk-pair-left{min-width:0; flex:1; text-align:left;}
  .gk-pair-label{font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px;}
  .gk-pair-names{font-size:10.5px; color:var(--text); text-align:left;}
  .gk-pair-price{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; color:var(--amber); min-width:42px; text-align:right; flex-shrink:0;}
  .gk-pair-price-sub{font-size:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:1px;}
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Regia Asta</h1>
    <span class="tag">Fantacalcio 26/27</span>
  </div>

  <div class="scoreboard">
    <div class="sb-cell">
      <div class="lbl">Speso</div>
      <div class="val" id="spesoVal">0</div>
    </div>
    <div class="sb-cell" id="rimanenteCell">
      <div class="lbl">Rimanente</div>
      <div class="val" id="rimanenteVal">500</div>
    </div>
  </div>

  <div class="roles-strip" id="rolesStrip"></div>
</header>


<details class="strategy" id="strategyPanel">
  <summary>Strategia <span class="arrow">▸</span></summary>
  <div id="strategyBody"></div>
</details>

<details class="strategy" id="rosePanel">
  <summary>Rose <span class="arrow">▸</span></summary>
  <div id="roseBody"></div>
</details>

<div class="suggest-panel">
  <div class="suggest-header">Priorità acquisto — <span id="suggestRoleLabel"></span></div>
  <div id="suggestBody"></div>
</div>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Cerca giocatore...">
</div>
<div class="list-controls">
  <div class="toggle-wrap" id="hideTakenToggle">
    <div class="toggle-switch" id="hideTakenSwitch"></div>
    <span>Nascondi presi</span>
  </div>
</div>

<main id="main"></main>

<footer>
  <span class="status" id="saveStatus">—</span>
  <button id="resetBtn">Reset asta</button>
</footer>

<script>
const ROLES = {
  portieri: {label:'POR', full:'Portieri', slots:3},
  difensori: {label:'DIF', full:'Difensori', slots:8},
  centrocampisti: {label:'CEN', full:'Centrocampisti', slots:8},
  attaccanti: {label:'ATT', full:'Attaccanti', slots:6}
};

// Preferiti personali: mostrati con una stella accanto al nome.
const FAVORITES = {
  portieri: new Set(["Carnesecchi"]),
  difensori: new Set(["Miranda J.", "Jimenez", "Bisseck", "Kalulu", "Gila", "Mangas", "Di Lorenzo", "Valeri", "Mancini", "Solet", "Vojvoda", "Theate"]),
  centrocampisti: new Set(["Ederson", "Cambiaghi", "Baturina", "Ndour", "Njie", "Calò", "Baldanzi", "Calhanoglu", "Diouf", "Conceicao", "Taylor", "Zaccagni", "Isaksen", "McTominay", "Bernabè", "Volpato", "Cacciamani", "Vlasic", "Goncalves P.", "Ekkelenkamp"]),
  attaccanti: new Set(["De Ketelaere", "Maldini", "Diao", "Kvernadze", "Thuram", "Goncalo Ramos", "Pinamonti", "Alisson Santos", "Castro"])

function key(role, name){ return role + '|' + name; }
function getP(role, name){
  const k = key(role,name);
  if(!state.players[k]) state.players[k] = {owner:null, price:null};
  return state.players[k];
}
function managerName(id){
  if(id==='me') return 'Io';
  const idx = MANAGER_IDS.indexOf(id);
  return idx>=0 ? state.opponents[idx] : id;
}

let saveTimer = null;
async function save(){
  document.getElementById('saveStatus').textContent = 'salvataggio...';
  try{
    await window.storage.set('fantacalcio-2026-state-v3', JSON.stringify(state), false);
    document.getElementById('saveStatus').textContent = 'salvato';
  }catch(e){
    document.getElementById('saveStatus').textContent = 'errore salvataggio';
    console.error(e);
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
async function load(){
  try{
    const res = await window.storage.get('fantacalcio-2026-state-v3', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state = Object.assign(state, parsed);
      if(!state.opponents || state.opponents.length!==7){
        state.opponents = ['Avversario 1','Avversario 2','Avversario 3','Avversario 4','Avversario 5','Avversario 6','Avversario 7'];
      }
    }
  }catch(e){ /* nessuno stato salvato ancora */ }
}

function slotsFilledBy(managerId, role){
  let n = 0;
  for(const k in state.players){
    if(k.startsWith(role+'|') && state.players[k].owner===managerId) n++;
  }
  return n;
}
function slotsFilled(role){ return slotsFilledBy('me', role); }
function totalSpesoBy(managerId){
  let s = 0;
  for(const k in state.players){ if(state.players[k].owner===managerId) s += (state.players[k].price||0); }
  return s;
}
function totalSpeso(){ return totalSpesoBy('me'); }
function stratProgress(role, tiers){
  let n = 0;
  for(const p of PLAYER_DATA[role]){
    if(tiers.includes(p.tier)){
      const st = getP(role,p.name);
      if(st.owner==='me') n++;
    }
  }
  return n;
}

const RESERVE_STRENGTH = 0.72; // quota della riserva strategica che il MAX protegge davvero; il resto resta flessibile

function roleIndex(role){ return ROLE_SEQUENCE.indexOf(role); }
function totalSlotsMissingBy(managerId){
  return ROLE_SEQUENCE.reduce((sum, role)=>sum + Math.max(0, ROLES[role].slots - slotsFilledBy(managerId, role)), 0);
}
function roleCompleteForAll(role){
  return ALL_MANAGERS.every(mid => slotsFilledBy(mid, role) >= ROLES[role].slots);
}
function currentAuctionRole(){
  return ROLE_SEQUENCE.find(role => !roleCompleteForAll(role)) || ROLE_SEQUENCE[ROLE_SEQUENCE.length-1];
}
function managerMaxSpendable(managerId){
  const remaining = Math.max(0, state.budget - totalSpesoBy(managerId));
  const slotsAfter = Math.max(0, totalSlotsMissingBy(managerId) - 1);
  return Math.max(0, remaining - slotsAfter);
}


// GERARCHIA PER SLOT
// Lo slot descrive il livello che il giocatore dovrebbe occupare nella rosa finale.
// Il MAX viene ridotto se, in base ai giocatori già acquistati, il candidato scivolerebbe
// in uno slot più basso rispetto al suo livello naturale.
const SLOT_SCORE_THRESHOLDS = {
  difensori:[8.5,7.8,7.2,6.7,6.2,5.8,5.3,-Infinity],
  centrocampisti:[9.2,8.5,7.8,7.3,6.8,6.3,5.8,-Infinity],
  attaccanti:[9.0,8.2,7.4,6.7,6.1,-Infinity],
  portieri:[8.0,6.5,-Infinity]
};
const SLOT_PREFIX = {portieri:'P',difensori:'D',centrocampisti:'C',attaccanti:'A'};

function naturalSlot(role, meta){
  const th = SLOT_SCORE_THRESHOLDS[role] || [-Infinity];
  const score = Number(meta.score)||0;
  for(let i=0;i<th.length;i++) if(score>=th[i]) return i+1;
  return th.length;
}

function projectedSlot(role, meta){
  const owned = PLAYER_DATA[role]
    .filter(p=>getP(role,p.name).owner==='me' && p.name!==meta.name)
    .map(p=>Number(p.score)||0);
  const actualRank = 1 + owned.filter(s=>s > (Number(meta.score)||0)).length;
  return Math.min(ROLES[role].slots, Math.max(naturalSlot(role,meta), actualRank));
}

function slotLabel(role, meta){
  return `${SLOT_PREFIX[role]||''}${projectedSlot(role,meta)}`;
}

function slotMaxFactor(role, meta){
  const natural = naturalSlot(role,meta);
  const projected = projectedSlot(role,meta);
  const demotion = Math.max(0, projected-natural);
  // Ogni slot perso riduce il tetto del 5%, fino a un massimo del 20%.
  return Math.max(0.80, 1 - 0.05*demotion);
}

/* ---------- PRICING DINAMICO ----------
   Per ogni bucket (ruolo, fascia) calcola il rapporto mediano prezzo_reale/FVM
   tra i giocatori gia' assegnati (a chiunque). Applica il fattore, con smorzamento
   finche' il campione e' piccolo, al prezzo consigliato base dei giocatori liberi. */
function median(arr){
  if(arr.length===0) return null;
  const s = arr.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function bucketKeyFor(role, tier){ return role+'|'+(tier||'ALL'); }
function computeMarketFactors(){
  const groups = {}; // bucketKey -> array of ratios
  for(const role in PLAYER_DATA){
    for(const meta of PLAYER_DATA[role]){
      const st = getP(role, meta.name);
      if(st.owner && st.price!=null && meta.fvm>0){
        const bk = bucketKeyFor(role, meta.tier);
        (groups[bk] = groups[bk]||[]).push(st.price/meta.fvm);
      }
    }
  }
  const factors = {};
  for(const bk in groups){
    const ratios = groups[bk];
    const n = ratios.length;
    const raw = median(ratios);
    const shrink = Math.min(1, n/6); // serve almeno ~6 transazioni per fidarsi al 100%
    factors[bk] = {factor: 1 + (raw-1)*shrink, n};
  }
  return factors;
}
function dynamicPrice(role, meta, factors){
  const bk = bucketKeyFor(role, meta.tier);
  const f = factors[bk];
  if(!f) return meta.prezzo;
  const adj = Math.max(0.4, Math.min(2.5, f.factor));
  return Math.max(1, Math.round(meta.prezzo*adj));
}

/* ---------- RISERVA DINAMICA + REPLACEMENT REALISTICO ----------
   Le riserve dei reparti incompleti vengono ricalcolate dopo ogni acquisto e la loro somma
   coincide sempre con il budget residuo. Ogni reparto mantiene almeno 1 credito per slot;
   il resto viene distribuito in proporzione al fabbisogno strategico stimato. */
function quantile(arr, q){
  if(!arr.length) return null;
  const s = arr.slice().sort((a,b)=>a-b);
  const pos = (s.length-1)*Math.max(0,Math.min(1,q));
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  if(lo===hi) return s[lo];
  return s[lo] + (s[hi]-s[lo])*(pos-lo);
}

function strategyRowFor(role){ return STRATEGY_ROWS.find(r=>r.role===role) || null; }
function premiumTiersFor(role){
  const row = strategyRowFor(role);
  return row ? row.tiers : (role==='portieri' ? ['TOP'] : ['TOP','SEMITOP']);
}

function plannedRoleReserve(role, factors, afterBuying=null){
  const boughtHere = afterBuying && afterBuying.role===role ? 1 : 0;
  const missing = Math.max(0, ROLES[role].slots - slotsFilled(role) - boughtHere);
  if(missing===0) return 0;

  const row = strategyRowFor(role);
  const premiumTiers = premiumTiersFor(role);
  let premiumDone = stratProgress(role, premiumTiers);
  if(afterBuying && afterBuying.role===role && premiumTiers.includes(afterBuying.meta.tier)) premiumDone++;
  const premiumNeed = row ? Math.min(missing, Math.max(0, row.target - premiumDone)) : 0;

  const free = PLAYER_DATA[role].filter(p =>
    getP(role,p.name).owner===null && (!afterBuying || afterBuying.meta.name!==p.name)
  );
  const allPrices = free.map(p=>dynamicPrice(role,p,factors)).filter(Number.isFinite);
  const premiumPrices = free.filter(p=>premiumTiers.includes(p.tier)).map(p=>dynamicPrice(role,p,factors));
  const depthPrices = free.filter(p=>!premiumTiers.includes(p.tier)).map(p=>dynamicPrice(role,p,factors));

  // Non uso il giocatore più economico: una quantile bassa evita di fondare il piano su occasioni che potrebbero sparire.
  const premiumRef = Math.max(1, Math.round(quantile(premiumPrices,0.35) ?? quantile(allPrices,0.55) ?? 1));
  const depthRef = Math.max(1, Math.round(quantile(depthPrices,0.25) ?? quantile(allPrices,0.25) ?? 1));
  const depthNeed = Math.max(0, missing-premiumNeed);
  return Math.max(missing, premiumNeed*premiumRef + depthNeed*depthRef);
}

function normalizedRoleReserves(factors){
  const remaining = Math.max(0, state.budget - totalSpeso());

  const info = ROLE_SEQUENCE.map((role,idx)=>{
    const missing = Math.max(0, ROLES[role].slots - slotsFilled(role));
    const floor = missing; // minimo assoluto: 1 credito per ogni slot ancora vuoto
    const desired = missing>0 ? Math.max(floor, plannedRoleReserve(role,factors)) : 0;
    return {role,idx,missing,floor,desired,reserve:0,raw:0};
  }).filter(x=>x.missing>0);

  if(!info.length) return Object.fromEntries(ROLE_SEQUENCE.map(r=>[r,0]));

  const totalFloor = info.reduce((s,x)=>s+x.floor,0);

  // Caso patologico: budget residuo insufficiente perfino per 1 credito a slot.
  // Distribuiamo comunque tutto il residuo, privilegiando i reparti con più slot mancanti.
  if(remaining <= totalFloor){
    const totalMissing = Math.max(1, info.reduce((s,x)=>s+x.missing,0));
    let assigned = 0;
    info.forEach((x,i)=>{
      const raw = remaining * x.missing / totalMissing;
      x.raw = raw;
      x.reserve = Math.floor(raw);
      assigned += x.reserve;
    });
    let left = remaining-assigned;
    info.sort((a,b)=>(b.raw-Math.floor(b.raw))-(a.raw-Math.floor(a.raw)) || a.idx-b.idx);
    for(let i=0;i<left;i++) info[i%info.length].reserve++;
  } else {
    const extra = remaining-totalFloor;

    // Il peso strategico deriva da quanto il reparto "vorrebbe" spendere oltre al minimo.
    // Se tutti i desideri coincidono col minimo, uso gli slot mancanti come peso.
    let weights = info.map(x=>Math.max(0,x.desired-x.floor));
    let weightSum = weights.reduce((s,w)=>s+w,0);
    if(weightSum<=0){
      weights = info.map(x=>x.missing);
      weightSum = weights.reduce((s,w)=>s+w,0);
    }

    let assignedExtra = 0;
    info.forEach((x,i)=>{
      const rawExtra = extra * weights[i] / Math.max(1,weightSum);
      x.raw = rawExtra;
      const add = Math.floor(rawExtra);
      x.reserve = x.floor + add;
      assignedExtra += add;
    });

    // Arrotondamento a somma esatta: assegna i crediti residui alle frazioni maggiori.
    let left = extra-assignedExtra;
    const order = info.slice().sort((a,b)=>
      (b.raw-Math.floor(b.raw))-(a.raw-Math.floor(a.raw)) || a.idx-b.idx
    );
    for(let i=0;i<left;i++) order[i%order.length].reserve++;
  }

  const out = Object.fromEntries(ROLE_SEQUENCE.map(r=>[r,0]));
  info.forEach(x=>out[x.role]=x.reserve);
  return out;
}

function reserveAfterPurchase(role, meta, factors){
  // Compatibilità con il resto del tool: restituisce la quota che va protetta
  // FUORI dall'acquisto corrente, usando la nuova allocazione dinamica.
  const reserves = normalizedRoleReserves(factors);
  const remaining = Math.max(0, state.budget-totalSpeso());
  const missingHere = Math.max(1, ROLES[role].slots-slotsFilled(role));
  const roleReserve = reserves[role] || 0;

  // Del budget assegnato al reparto, almeno 1 credito resta per ciascuno
  // degli altri slot del reparto dopo questo acquisto.
  const sameRoleFloorAfter = Math.max(0, missingHere-1);
  const protectedOtherRoles = Math.max(0, remaining-roleReserve);
  const effective = protectedOtherRoles + sameRoleFloorAfter;

  return {
    absoluteFloor: Math.max(0,totalSlotsMissingBy('me')-1),
    desired: effective,
    effective,
    roleReserve,
    reserves
  };
}

function smartBudgetCap(role, meta, factors){
  const remaining = Math.max(0, state.budget-totalSpeso());
  const reserves = normalizedRoleReserves(factors);
  const roleReserve = reserves[role] || 0;
  const missingHere = Math.max(1, ROLES[role].slots-slotsFilled(role));

  // Il singolo acquisto può usare al massimo la quota del reparto,
  // lasciando 1 credito per ogni altro slot ancora da riempire nello stesso reparto.
  const roleCap = Math.max(1, roleReserve-Math.max(0,missingHere-1));
  const globalCap = managerMaxSpendable('me');

  return {
    cap: Math.max(1, Math.min(roleCap, globalCap || roleCap)),
    reserve: {
      roleReserve,
      reserves,
      effective: Math.max(0,remaining-roleCap),
      absoluteFloor: Math.max(0,totalSlotsMissingBy('me')-1),
      desired: Math.max(0,remaining-roleCap)
    }
  };
}

function currentRoleSlotBudget(role, factors){
  const reserves = normalizedRoleReserves(factors);
  const missing = Math.max(1, ROLES[role].slots-slotsFilled(role));
  return Math.max(1, (reserves[role]||0)/missing);
}

function tierRank(role, tier){
  if(role==='portieri') return tier==='TOP' ? 2 : 0;
  return ({TOP:3,SEMITOP:2,LOWCOST_TITOLARI:1,LOWCOST_SORPRESE:0})[tier] ?? 0;
}
function replacementTierCompatible(role, candidateTier, altTier){
  if(role==='portieri') return candidateTier===altTier;
  const c=tierRank(role,candidateTier), a=tierRank(role,altTier);
  if(c>=3) return a>=2;          // TOP -> TOP / SEMITOP
  if(c===2) return a>=1;         // SEMITOP -> SEMITOP / lowcost titolare (o TOP se costa simile)
  return a<=1;                   // lowcost -> altri lowcost
}

function replacementInfo(role, meta, factors){
  const ideal = dynamicPrice(role,meta,factors);
  const slotBudget = currentRoleSlotBudget(role,factors);
  const priceCeiling = Math.max(ideal*1.25, slotBudget*1.10);
  let alternatives = PLAYER_DATA[role].filter(p =>
    p.name!==meta.name && getP(role,p.name).owner===null && p.score!=null &&
    replacementTierCompatible(role,meta.tier,p.tier) && dynamicPrice(role,p,factors)<=priceCeiling
  );
  if(!alternatives.length){
    alternatives = PLAYER_DATA[role].filter(p =>
      p.name!==meta.name && getP(role,p.name).owner===null && p.score!=null && dynamicPrice(role,p,factors)<=ideal*1.30
    );
  }
  alternatives.sort((a,b)=>(b.score||0)-(a.score||0) || dynamicPrice(role,a,factors)-dynamicPrice(role,b,factors));
  const replacement = alternatives[0] || null;
  const replacementIdeal = replacement ? dynamicPrice(role,replacement,factors) : null;
  const gap = replacement ? Math.max(0,(meta.score||0)-(replacement.score||0)) : 0;
  return {player:replacement, gap, ideal:replacementIdeal, slotBudget, priceCeiling};
}

function cliffInfo(role, meta, factors, replacement=null){
  const rep = replacement || replacementInfo(role,meta,factors);
  const gap = rep.gap || 0;
  let level='none', label='';
  if(!rep.player && (meta.score||0)>=6){ level='high'; label='ULTIMO LIVELLO'; }
  else if(gap>=0.75){ level='high'; label='CLIFF ALTO'; }
  else if(gap>=0.40){ level='mid'; label='CLIFF'; }
  else if(gap>=0.25){ level='low'; label=''; }
  return {gap,level,label};
}

/* ---------- PRESSIONE AVVERSARIA SPECIFICA ----------
   Un rivale conta davvero solo se ha ancora slot nel ruolo e un tetto teorico compatibile
   con il prezzo del giocatore. Non assumiamo preferenze personali che il tool non conosce. */
function playerOpponentPressure(role, meta, factors){
  const ideal = Math.max(1,dynamicPrice(role,meta,factors));
  const rivals = MANAGER_IDS.map(id=>{
    const missing = Math.max(0,ROLES[role].slots-slotsFilledBy(id,role));
    const maxBid = managerMaxSpendable(id);
    const affordability = maxBid/ideal;
    const demand = missing/Math.max(1,ROLES[role].slots);
    const weight = missing>0 ? Math.min(1,affordability)*(0.60+0.40*demand) : 0;
    return {id,name:managerName(id),missing,maxBid,affordability,weight};
  }).filter(x=>x.missing>0 && x.maxBid>=Math.max(1,ideal*0.80))
    .sort((a,b)=>b.maxBid-a.maxBid);

  const strong = rivals.filter(x=>x.maxBid>=ideal);
  const pressureIndex = Math.max(0,Math.min(1,
    (rivals.length/MANAGER_IDS.length)*0.65 +
    (rivals.reduce((s,x)=>s+x.weight,0)/Math.max(1,MANAGER_IDS.length))*0.35
  ));
  return {
    rivals,
    competitors:rivals.length,
    strongCompetitors:strong.length,
    richestMax:rivals.length?rivals[0].maxBid:0,
    pressureIndex,
    maxBoost:0.08*pressureIndex
  };
}

function playerAuctionValues(role, meta, factors){
  const ideal = dynamicPrice(role, meta, factors);
  const replacement = replacementInfo(role, meta, factors);
  const cliff = cliffInfo(role,meta,factors,replacement);
  const market = playerOpponentPressure(role,meta,factors);
  const budget = smartBudgetCap(role,meta,factors);

  const relativeGap = replacement.player ? replacement.gap/Math.max(1,meta.score||1) : 0.10;
  const replacementBoost = Math.min(0.22, relativeGap*1.55);
  const cliffBoost = cliff.level==='high' ? 0.05 : (cliff.level==='mid' ? 0.025 : 0);
  const totalBoost = Math.min(0.30, replacementBoost + cliffBoost + market.maxBoost);

  // PMA del video: riferimento di mercato, NON prezzo da inseguire.
  // Se il mercato medio è sopra il nostro ideale, assorbiamo solo il 35% del gap
  // e comunque non oltre +12% dell'ideale. Se è sotto, riduciamo il tetto con prudenza.
  let pmaAdjustment = 0;
  if(meta.pmaPct!=null){
    const pmaCredits = meta.pmaPct*5; // PMA espresso in % su budget 500
    const gap = pmaCredits-ideal;
    if(gap>0) pmaAdjustment = Math.min(ideal*0.12, gap*0.35);
    else pmaAdjustment = Math.max(-ideal*0.08, gap*0.20);
  }

  const strategicMax = Math.round(ideal*(1+totalBoost) + pmaAdjustment);
  const slot = projectedSlot(role,meta);
  const slotFactor = slotMaxFactor(role,meta);
  const slotAdjustedMax = Math.max(1, Math.round(strategicMax*slotFactor));

  return {
    score:meta.score||0,
    ideal,
    max:Math.max(1,Math.min(slotAdjustedMax,budget.cap)),
    slot,
    slotFactor,
    replacement:replacement.player,
    replacementGap:replacement.gap,
    replacementIdeal:replacement.ideal,
    cliff,
    competitors:market.competitors,
    strongCompetitors:market.strongCompetitors,
    richestRivalMax:market.richestMax,
    rivals:market.rivals,
    opponentPressure:market.pressureIndex,
    budgetCap:budget.cap,
    reserve:budget.reserve
  };
}

/* ---------- VALUE ABOVE REPLACEMENT / "AFFARE" ----------
   Un affare deve dare un vantaggio reale sull'alternativa. Per evitare che vincano sempre
   i giocatori da pochi crediti, richiedo un gap minimo e misuro il guadagno per costo incrementale. */
function computeAffareSet(role, factors){
  const free = PLAYER_DATA[role].filter(m=>getP(role,m.name).owner===null && m.score);
  if(free.length<4) return new Set();
  const withVal = free.map(m=>{
    const rep = replacementInfo(role,m,factors);
    if(!rep.player || rep.gap<0.30) return null;
    const ideal = dynamicPrice(role,m,factors);
    const incrementalCost = Math.max(1, ideal-(rep.ideal||0));
    return {name:m.name,val:rep.gap/incrementalCost,gap:rep.gap};
  }).filter(Boolean).sort((a,b)=>b.val-a.val || b.gap-a.gap);
  if(!withVal.length) return new Set();
  const cut=Math.max(1,Math.round(withVal.length*0.15));
  return new Set(withVal.slice(0,cut).map(x=>x.name));
}

function teamGoalkeepers(team){
  return PLAYER_DATA.portieri
    .filter(p => p.squadra===team)
    .slice()
    .sort((a,b)=>(b.score||0)-(a.score||0) || (b.prezzo||0)-(a.prezzo||0));
}

function goalkeeperPairForSameTeam(top){
  if(top.squadra==='Juventus'){
    const wanted=['Grabara','Pinsoglio']
      .map(n=>PLAYER_DATA.portieri.find(p=>p.name===n))
      .filter(Boolean)
      .filter(p=>p.name!==top.name && getP('portieri',p.name).owner===null);
    if(wanted.length===2) return wanted;
  }
  const mates = teamGoalkeepers(top.squadra)
    .filter(p => p.name!==top.name && getP('portieri',p.name).owner===null)
    .slice(0,2);
  return mates.length===2 ? mates : null;
}

function goalkeeperPairForPartnerTeam(team){
  const depth = teamGoalkeepers(team).slice(0,2);
  if(depth.length<2) return null;
  return depth.every(p => getP('portieri',p.name).owner===null) ? depth : null;
}

function renderGoalkeeperCompletionSuggestions(body, factors, ownedKeeper){

  // il terzetto, ordinando prima la coppia della stessa squadra e poi i migliori incastri.
  const combinations = [];

  const same = goalkeeperPairForSameTeam(ownedKeeper);
  if(same){
    combinations.push({
      label:`Blocco ${ownedKeeper.squadra}`,
      rating:100,
      pair:same,
      kind:'same'
    });
  }

  const ranked = GK_PAIR_RANKINGS[ownedKeeper.squadra] || [];
  for(const [team,rating] of ranked){
    const pair = goalkeeperPairForPartnerTeam(team);
    if(pair) combinations.push({label:`Incastro ${rating}`, team, rating, pair, kind:'partner'});
    if(combinations.filter(x=>x.kind==='partner').length>=4) break;
  }

  if(!combinations.length){
    body.innerHTML = '<div class="empty" style="padding:6px 0;">Nessuna coppia libera disponibile per completare i portieri.</div>';
    return;
  }

  const pairRecommendedPrice = pair => pair.reduce((sum,p)=>sum + dynamicPrice('portieri',p,factors),0);
  const card=document.createElement('div');
  card.className='gk-suggest-card';
  const paid=getP('portieri',ownedKeeper.name).price;
  card.innerHTML=`
    <div class="gk-suggest-head">
      <span class="p-dot tier-${ownedKeeper.tier}-dot"></span>
      <div class="suggest-namewrap">
        <div class="suggest-name">${ownedKeeper.name}${favStar('portieri',ownedKeeper.name)} <span class="suggest-team">${ownedKeeper.squadra} · già preso</span></div>
      </div>
      <div class="suggest-price">${paid??'—'}<div class="p-price-sub">pagato</div></div>
    </div>
    <div class="gk-pairs">
      ${combinations.map((x,i)=>`
        <div class="gk-pair">
          <div class="gk-pair-left">
            <div class="gk-pair-label">${i===0?'Combinazione consigliata':(x.kind==='same'?'Stessa squadra':`${x.team} · incastro ${x.rating}`)}</div>
            <div class="gk-pair-names">${x.pair[0].name}${favStar('portieri',x.pair[0].name)} + ${x.pair[1].name}${favStar('portieri',x.pair[1].name)}</div>
          </div>
          <div class="gk-pair-price">${pairRecommendedPrice(x.pair)}<div class="gk-pair-price-sub">coppia</div></div>
        </div>`).join('')}
    </div>`;
  body.appendChild(card);
}

function renderGoalkeeperSuggestions(body, factors){
  const myKeepers = PLAYER_DATA.portieri.filter(p => getP('portieri',p.name).owner==='me');
  if(myKeepers.length===1){
    renderGoalkeeperCompletionSuggestions(body, factors, myKeepers[0]);
    return;
  }

  const topCandidates = PLAYER_DATA.portieri
    .filter(p => p.tier==='TOP' && getP('portieri',p.name).owner===null)
    .map(p => ({p, values:playerAuctionValues('portieri',p,factors)}))
    .filter(c => c.values.ideal <= c.values.budgetCap)
    .sort((a,b)=>(b.p.score||0)-(a.p.score||0))
    .slice(0,1);

  if(topCandidates.length===0){
    body.innerHTML = '<div class="empty" style="padding:6px 0;">Nessun portiere TOP libero compatibile col budget.</div>';
    return;
  }

  topCandidates.forEach(c => {
    const card = document.createElement('div');
    card.className = 'gk-suggest-card';

    const same = goalkeeperPairForSameTeam(c.p);
    const ranked = GK_PAIR_RANKINGS[c.p.squadra] || [];
    const partnerPairs = [];
    for(const [team,rating] of ranked){
      const pair = goalkeeperPairForPartnerTeam(team);
      if(pair){ partnerPairs.push({team,rating,pair}); }
      if(partnerPairs.length===2) break;
    }

    const pairRecommendedPrice = pair => pair.reduce((sum, p) => sum + dynamicPrice('portieri', p, factors), 0);

    const sameHtml = same
      ? `<div class="gk-pair">
          <div class="gk-pair-left">
            <div class="gk-pair-label">Stessa squadra</div>
            <div class="gk-pair-names">${same[0].name}${favStar('portieri',same[0].name)} + ${same[1].name}${favStar('portieri',same[1].name)}</div>
          </div>
          <div class="gk-pair-price">${pairRecommendedPrice(same)}<div class="gk-pair-price-sub">coppia</div></div>
        </div>`
      : `<div class="gk-pair">
          <div class="gk-pair-left">
            <div class="gk-pair-label">Stessa squadra</div>
            <div class="gk-pair-names">coppia non disponibile</div>
          </div>
          <div class="gk-pair-price">—</div>
        </div>`;

    const partnerHtml = partnerPairs.map(x => `
      <div class="gk-pair">
        <div class="gk-pair-left">
          <div class="gk-pair-label">${x.team}</div>
          <div class="gk-pair-names">${x.pair[0].name}${favStar('portieri',x.pair[0].name)} + ${x.pair[1].name}${favStar('portieri',x.pair[1].name)}</div>
        </div>
        <div class="gk-pair-price">${pairRecommendedPrice(x.pair)}<div class="gk-pair-price-sub">coppia</div></div>
      </div>`).join('');

    card.innerHTML = `
      <div class="gk-suggest-head">
        <span class="p-dot tier-${c.p.tier}-dot"></span>
        <div class="suggest-namewrap">
          <div class="suggest-name">${c.p.name}${favStar('portieri',c.p.name)} <span class="suggest-team">${c.p.squadra}</span></div>
        </div>
        <div class="suggest-price">${c.values.ideal}<div class="p-price-sub">MAX ${c.values.max}</div></div>
      </div>
      <div class="gk-pairs">${sameHtml}${partnerHtml}</div>`;
    body.appendChild(card);
  });
}

/* ---------- PRIORITA' ACQUISTO ----------
   Classifica i liberi del ruolo combinando qualità, value above replacement, cliff,
   pressione avversaria e target strategici (solo come correttivo morbido). */
function renderSuggestions(){
  const role = ui.role;
  document.getElementById('suggestRoleLabel').textContent = ROLES[role].full;
  const body = document.getElementById('suggestBody');
  body.innerHTML = '';

  const factors = computeMarketFactors();
  if(role==='portieri'){
    renderGoalkeeperSuggestions(body, factors);
    return;
  }
  const affareSet = computeAffareSet(role,factors);
  const stratRow = strategyRowFor(role);
  const needOpen = stratRow ? stratProgress(stratRow.role,stratRow.tiers)<stratRow.target : false;

  const candidates = PLAYER_DATA[role]
    .filter(p=>getP(role,p.name).owner===null)
    .map(p=>{
      const values=playerAuctionValues(role,p,factors);
      let priority=p.score||0;
      const reasons=[];

      if(affareSet.has(p.name)){ priority+=1.20; reasons.push('affare'); }
      if(values.cliff.level==='high'){ priority+=1.35; reasons.push(values.cliff.label.toLowerCase()); }
      else if(values.cliff.level==='mid'){ priority+=0.70; reasons.push('cliff'); }
      else if(values.cliff.level==='low'){ priority+=0.30; }

      if(values.competitors>=5){ priority+=0.60; reasons.push(`${values.competitors} rivali`); }
      else if(values.competitors>=3){ priority+=0.30; reasons.push(`${values.competitors} rivali`); }

      if(stratRow && stratRow.tiers.includes(p.tier)){
        if(needOpen){ priority+=0.50; reasons.push('strategia'); }
        else { priority-=0.15; }
      }
      // Penalizza leggermente chi mangia quasi tutto il tetto intelligente disponibile.
      const capUse = values.budgetCap>0 ? values.ideal/values.budgetCap : 9;
      if(capUse>0.85) priority-=0.40;

      return {p,values,priority,reasons};
    })
    .filter(c=>c.values.ideal<=c.values.budgetCap)
    .sort((a,b)=>b.priority-a.priority)
    .slice(0,3);

  if(candidates.length===0){
    body.innerHTML='<div class="empty" style="padding:6px 0;">Nessun candidato compatibile con la riserva di budget.</div>';
    return;
  }

  candidates.forEach(c=>{
    const row=document.createElement('div');
    row.className='suggest-row';
    const baseTags=c.reasons.slice(0,2).map(r=>`<span class="suggest-tag">${r}</span>`).join('');
    const rigTag=RIGORISTI[c.p.name]?'<span class="suggest-tag">RIG</span>':'';
    const tagHtml=baseTags+rigTag;
    row.innerHTML=`
      <span class="p-dot tier-${c.p.tier}-dot"></span>
      <div class="suggest-namewrap">
        <div class="suggest-name">${c.p.name}${favStar(role,c.p.name)}${currentInjuryHtml(c.p.name)} <span class="suggest-team">${c.p.squadra}</span></div>
        <div class="suggest-tags">${tagHtml}</div>
      </div>
      <div class="suggest-price">${c.values.ideal}<div class="p-price-sub">MAX ${c.values.max}</div></div>`;
    body.appendChild(row);
  });
}

function renderHeader(){
  const speso = totalSpeso();
  const rimanente = state.budget - speso;
  document.getElementById('spesoVal').textContent = speso;
  document.getElementById('rimanenteVal').textContent = rimanente;
  document.getElementById('rimanenteCell').classList.toggle('warn', rimanente < 0);

  const phase=currentAuctionRole();
  const totalPhaseSlots=ROLES[phase].slots*ALL_MANAGERS.length;
  const filledPhase=ALL_MANAGERS.reduce((sum,mid)=>sum+Math.min(ROLES[phase].slots,slotsFilledBy(mid,phase)),0);
  (document.getElementById('phaseText')||{textContent:null}).textContent=`${ROLES[phase].full.toUpperCase()} · ${filledPhase}/${totalPhaseSlots}`;

  const strip = document.getElementById('rolesStrip');
  strip.innerHTML = '';
  for(const r in ROLES){
    const filled = slotsFilled(r);
    const el = document.createElement('div');
    el.className = 'role-chip' + (ui.role===r ? ' active':'');
    el.dataset.role = r;
    el.innerHTML = `<div class="rn">${ROLES[r].label}</div><div class="rc">${filled}/${ROLES[r].slots}</div>`;
    strip.appendChild(el);

}

function renderStrategy(){
  const body=document.getElementById('strategyBody');
  body.innerHTML='';
  STRATEGY_ROWS.forEach((row,i)=>{
    const done=stratProgress(row.role,row.tiers);
    const target=row.target;
    const pct=Math.min(100,Math.round(100*done/Math.max(1,target)));
    const el=document.createElement('div');
    el.className='strat-row';
    el.innerHTML=`
      <span class="strat-label">${row.label}</span>
      <div class="strat-bar"><div class="strat-bar-fill" style="width:${pct}%"></div></div>
      <span class="mono" style="min-width:34px;text-align:right;">${done}/${target}</span>
      <input type="number" class="strat-target" data-idx="${i}" value="${target}" min="0" max="10" style="margin-left:8px;">`;
    body.appendChild(el);
  });

  const factors=computeMarketFactors();
  const sub=document.createElement('div');
  sub.className='strat-subhead';
  sub.textContent='BUDGET DINAMICO';
  body.appendChild(sub);
  const phaseIdx=Math.max(0,roleIndex(currentAuctionRole()));
  const reserves=normalizedRoleReserves(factors);
  const remaining=Math.max(0,state.budget-totalSpeso());
  ROLE_SEQUENCE.forEach((role,idx)=>{
    if(idx<phaseIdx && slotsFilled(role)>=ROLES[role].slots) return;
    const missing=Math.max(0,ROLES[role].slots-slotsFilled(role));
    if(missing===0) return;
    const reserve=reserves[role]||0;
    const row=document.createElement('div');
    row.className='budget-row';
    row.innerHTML=`<span class="budget-role">${ROLES[role].label}</span><span class="budget-mid">${missing} slot da coprire${idx===phaseIdx?' · ORA':''}</span><span class="budget-slot">RISERVA ${reserve}</span>`;
    body.appendChild(row);
  });
  const totalReserve=ROLE_SEQUENCE.reduce((s,r)=>s+(reserves[r]||0),0);
  const check=document.createElement('div');
  check.className='strat-subhead';
  check.style.marginTop='6px';
  check.style.paddingTop='7px';
  check.innerHTML=`TOTALE RISERVE <span class="mono" style="float:right;color:var(--amber)">${totalReserve} / ${remaining}</span>`;
  body.appendChild(check);
}

const TIER_ORDER = ['TOP','SEMITOP','LOWCOST_TITOLARI','LOWCOST_SORPRESE'];
const TIER_LABELS = {TOP:'Top', SEMITOP:'Semitop', LOWCOST_TITOLARI:'Lowcost Titolari', LOWCOST_SORPRESE:'Lowcost Sorprese', LOWCOST:'Lowcost'};
const POR_TIER_ORDER = ['TOP','LOWCOST'];


function renderList(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const role = ui.role;
  const q = ui.search.trim().toLowerCase();
  let list = PLAYER_DATA[role].filter(p => !q || p.name.toLowerCase().includes(q));

  if(state.hideTaken){
    list = list.filter(p => getP(role,p.name).owner===null);
  }

  if(list.length===0){ main.innerHTML = '<div class="empty">Nessun giocatore trovato.</div>'; return; }

  const factors = computeMarketFactors();
  const affareSet = computeAffareSet(role, factors);
  const container = document.createElement('div');

  const favoriteGroup = list
    .filter(p => FAVORITES[role] && FAVORITES[role].has(p.name))
    .sort((a,b)=>b.score-a.score);

  if(favoriteGroup.length){
    const freeFavs = favoriteGroup.filter(p => getP(role,p.name).owner===null).length;
    const favHeader = document.createElement('div');
    favHeader.className = 'tier-header tier-PREFERITI';
    favHeader.innerHTML = `<span>★ PREFERITI</span><span class="tier-scarcity${freeFavs<=2?' low':''}">${freeFavs} liberi</span>`;
    container.appendChild(favHeader);
    favoriteGroup.forEach(p => container.appendChild(renderPlayer(role,p,factors,affareSet)));
  }

  const tierOrder = role==='portieri' ? POR_TIER_ORDER : TIER_ORDER;

  tierOrder.forEach(tier => {
    const group = list.filter(p => p.tier===tier).sort((a,b)=>b.score-a.score);
    if(group.length===0) return;
    const freeLeft = PLAYER_DATA[role].filter(p => p.tier===tier && getP(role,p.name).owner===null).length;
    const header = document.createElement('div');
    header.className = 'tier-header tier-'+tier;
    header.innerHTML = `<span>${TIER_LABELS[tier]}</span><span class="tier-scarcity${freeLeft<=2?' low':''}">${freeLeft} liberi</span>`;
    container.appendChild(header);
    group.forEach(p => container.appendChild(renderPlayer(role, p, factors, affareSet)));
  });

  main.appendChild(container);
}



function renderPlayer(role, meta, factors, affareSet){
  const name = meta.name;
  const p = getP(role, name);
  const k = key(role,name);
  const div = document.createElement('div');
  const statusClass = p.owner==='me' ? 'status-mine' : (p.owner ? 'status-other' : 'status-free');
  div.className = 'player '+statusClass;
  div.dataset.key = k;

  const dot = meta.tier ? `<span class="p-dot tier-${meta.tier}-dot"></span>` : '';
  const values = playerAuctionValues(role, meta, factors);
  const dyn = values.ideal;
  const intelTags=[];
  if(affareSet.has(name)) intelTags.push('<span class="intel-tag affare">AFFARE</span>');
  const rigTag=rigoristaTagHtml(name); if(rigTag) intelTags.push(rigTag);
  const intelHtml=intelTags.length?`<div class="p-intel">${intelTags.join('')}</div>`:'';
  const scoreTag = meta.score ? `<div class="p-health-inline">${titolaritaInlineHtml(name)}${injuryInlineHtml(name)}<span class="p-score">SCORE ${meta.score.toFixed(1)}</span></div>` : `<div class="p-health-inline">${titolaritaInlineHtml(name)}${injuryInlineHtml(name)}</div>`;
  let priceBlock = '';
  if(p.owner==='me'){
    priceBlock = `<div class="p-price-block"><div class="p-price-main paid">${p.price!=null?p.price:0}</div>${scoreTag}<div class="p-price-sub">pagato</div></div>`;
  } else if(p.owner){
    priceBlock = `<div class="p-price-block"><div class="p-price-main other">${p.price!=null?p.price:'—'}</div>${scoreTag}<div class="p-price-sub">${managerName(p.owner)}</div></div>`;
  } else {
    const diff = dyn - meta.prezzo;
    let trend = '';
    if(Math.abs(diff) >= Math.max(1, meta.prezzo*0.06)){
      trend = diff>0 ? '<span class="p-trend up">▲</span>' : '<span class="p-trend down">▼</span>';
    }
    priceBlock = `<div class="p-price-block">
      <div class="p-metrics">
        ${titolaritaMetricHtml(name)}
        ${injuryMetricHtml(name)}
        <div class="p-metric p-metric-score"><div class="p-metric-label">SCORE</div><div class="p-metric-value">${values.score.toFixed(1)}</div></div>
        <div class="p-metric p-metric-ideal"><div class="p-metric-label">€€ IDEALE</div><div class="p-metric-value">${dyn}${trend}</div></div>
        <div class="p-metric p-metric-max"><div class="p-metric-label">€€ MAX</div><div class="p-metric-value">${values.max}</div></div>
      </div>
    </div>`;
  }

  const row = document.createElement('div');
  row.className = 'p-row';
  row.innerHTML = `
    ${dot}
    <div class="p-namewrap">
      <div class="p-name">${p.owner && p.owner!=='me' ? '<span class="strike">'+name+'</span>' : name}${favStar(role,name)}${currentInjuryHtml(name)}</div>
      <div class="p-team">${meta.squadra}</div>
      ${!p.owner ? intelHtml : ''}
    </div>
    ${p.owner==='me' ? '<span class="p-badge mine">MIO</span>' : ''}
    ${p.owner && p.owner!=='me' ? '<span class="p-badge other">'+managerName(p.owner).toUpperCase()+'</span>' : ''}
    ${priceBlock}
  `;
  row.addEventListener('click', ()=>{
    ui.expanded = (ui.expanded === k) ? null : k;
    renderList();
  });
  div.appendChild(row);

  const panel = document.createElement('div');
  panel.className = 'p-panel' + (ui.expanded===k ? ' open':'');
  const oppChips = MANAGER_IDS.map(id => `<span class="owner-chip${p.owner===id?' active':''}" data-owner="${id}">${managerName(id)}</span>`).join('');
  const replacementText=values.replacement ? `${values.replacement.name} · ${values.replacement.score.toFixed(1)} · ~${values.replacementIdeal}` : 'nessuno comparabile';
  panel.innerHTML = `
    ${(CURRENT_INJURED[name] || !p.owner) ? `<div class="decision-box">
      ${currentInjuryPanelHtml(name)}
      ${!p.owner ? `<div class="decision-cell"><div class="decision-lbl">Replacement</div><div class="decision-val" title="${replacementText}">${replacementText}</div></div>` : ''}
    </div>` : ''}
    <div class="fld">
      <label>Prezzo pagato</label>
      <input type="number" min="0" class="price-input" value="${p.price!==null?p.price:''}" placeholder="${dyn}">
    </div>
    <div class="btn-row">
      <button class="btn btn-mine" data-act="me">Mio</button>
      <button class="btn btn-free" data-act="free">Libera</button>
    </div>
    <span class="panel-section-lbl">Preso da un avversario:</span>
    <div class="owner-chips">${oppChips}</div>
  `;
  panel.querySelector('.price-input').addEventListener('click', e=>e.stopPropagation());
  panel.addEventListener('click', e=>{
    const chip = e.target.closest('.owner-chip');
    const btn = e.target.closest('button');
    if(!chip && !btn) { e.stopPropagation(); return; }
    e.stopPropagation();
    const priceVal = panel.querySelector('.price-input').value;
    let ownerId = null;
    if(chip) ownerId = chip.dataset.owner;
    else if(btn) ownerId = btn.dataset.act==='free' ? null : btn.dataset.act;
    if(ownerId){
      p.owner = ownerId;
      p.price = priceVal==='' ? dyn : parseInt(priceVal,10);
    } else {
      p.owner = null; p.price=null;
    }
    ui.expanded = null;
    scheduleSave();
    renderAll();
  });
  div.appendChild(panel);
  return div;
}

function renderRosters(){
  const body = document.getElementById('roseBody');
  body.innerHTML = '';
  ALL_MANAGERS.forEach(mid => {
    const card = document.createElement('div');
    card.className = 'rose-card';
    const speso = totalSpesoBy(mid);
    const rimanente = state.budget - speso;
    const nameHtml = mid==='me'
      ? `<span class="rose-name me">Io</span>`
      : `<input class="rose-name-input" data-oppidx="${MANAGER_IDS.indexOf(mid)}" value="${managerName(mid)}">`;
    const slotsHtml = Object.keys(ROLES).map(r => {
      const filled = slotsFilledBy(mid, r);
      const full = filled >= ROLES[r].slots;
      return `<div class="rose-slot${full?' full':''}">${ROLES[r].label} ${filled}/${ROLES[r].slots}</div>`;
    }).join('');
    card.innerHTML = `
      <div class="rose-head">
        <div>${nameHtml}</div>
        <div class="rose-stats">Speso <b>${speso}</b> · Rim. <b>${rimanente}</b></div>
      </div>
      <div class="rose-slots">${slotsHtml}</div>
      <div class="rose-players" id="rosePlayers-${mid}"></div>
    `;
    const head = card.querySelector('.rose-head');
    head.addEventListener('click', (e)=>{
      if(e.target.classList.contains('rose-name-input')) return;
      ui.roseOpen = (ui.roseOpen===mid) ? null : mid;
      renderRosters();
    });
    const nameInput = card.querySelector('.rose-name-input');
    if(nameInput){
      nameInput.addEventListener('click', e=>e.stopPropagation());
      nameInput.addEventListener('change', e=>{
        state.opponents[parseInt(e.target.dataset.oppidx,10)] = e.target.value || managerName(mid);
        scheduleSave();
        renderAll();
      });
    }
    const playersDiv = card.querySelector('.rose-players');
    if(ui.roseOpen===mid){
      playersDiv.classList.add('open');
      let rows = '';
      for(const role in ROLES){
        PLAYER_DATA[role].forEach(meta => {
          const st = getP(role, meta.name);
          if(st.owner===mid){
            rows += `<div class="rose-player-row"><b>${meta.name}${favStar(role,meta.name)}${currentInjuryHtml(meta.name)}</b><span class="mono">${st.price!=null?st.price:'-'}</span></div>`;
          }
        });
      }
      playersDiv.innerHTML = rows || '<div class="rose-player-row" style="justify-content:center;">Nessun giocatore ancora</div>';
    }
    body.appendChild(card);
  });
}

function applySavedStrategyTargets(){
  if(!state.strategyTargets) return;
  STRATEGY_ROWS.forEach(row=>{
    if(Number.isFinite(Number(state.strategyTargets[row.role]))) row.target=Number(state.strategyTargets[row.role]);
  });
}

(async function init(){
  await load();
  applySavedStrategyTargets();
  ui.role=currentAuctionRole();
  document.getElementById('hideTakenSwitch').classList.toggle('on', state.hideTaken);
  renderAll();
})();

</script>
</body>
</html>
